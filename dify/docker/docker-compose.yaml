version: '3.8'

services:
  # Dify 基础服务
  postgresql:
    image: docker.m.daocloud.io/library/postgres:15-alpine
    restart: always
    volumes:
      - ./volumes/postgres/data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: difyai123456
      POSTGRES_DB: dify
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: docker.m.daocloud.io/library/redis:6-alpine
    restart: always
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  weaviate:
    image: docker.m.daocloud.io/semitechnologies/weaviate:1.19.0
    restart: always
    volumes:
      - ./volumes/weaviate:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      CLUSTER_HOSTNAME: 'node1'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Dify 核心服务
  api:
    image: docker.m.daocloud.io/langgenius/dify-api:latest
    restart: always
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    environment:
      MODE: api
      SECRET_KEY: M83jMgJALLzTC0KFojhR6o-M7XfRxwuo6gM1Gt0GFnk
      DB_USERNAME: postgres
      DB_PASSWORD: difyai123456
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USE_SSL: 'false'
      REDIS_DB: 0
      REDIS_PASSWORD: ''
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_API_KEY: ''
      WEAVIATE_BATCH_SIZE: 100
      FILES_URL: ''
      CONSOLE_API_URL: ''
      APP_API_URL: ''
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      MULTIMODAL_SEND_IMAGE_FORMAT: base64
      TEMPLATE_TRANSFORM_ENABLED: 'true'
      LOG_LEVEL: INFO
      DISABLE_DEBUG: 'true'
      SENTRY_DSN: ''
      SENTRY_TRACES_SAMPLE_RATE: 1.0
      SENTRY_PROFILES_SAMPLE_RATE: 1.0
      NOTION_INTEGRATION_TYPE: internal
      GITHUB_CLIENT_ID: ''
      GITHUB_CLIENT_SECRET: ''
      GITHUB_APP_ID: ''
      GITHUB_APP_PRIVATE_KEY: ''
      STRIPE_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      BILLING_ENABLED: 'false'
    volumes:
      - ./volumes/app/storage:/app/api/storage
    ports:
      - "5001:5001"

  worker:
    image: docker.m.daocloud.io/langgenius/dify-api:latest
    restart: always
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    environment:
      MODE: worker
      SECRET_KEY: M83jMgJALLzTC0KFojhR6o-M7XfRxwuo6gM1Gt0GFnk
      DB_USERNAME: postgres
      DB_PASSWORD: difyai123456
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USE_SSL: 'false'
      REDIS_DB: 0
      REDIS_PASSWORD: ''
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_API_KEY: ''
      WEAVIATE_BATCH_SIZE: 100
      CELERY_AUTO_SCALE: 'false'
      CELERY_MAX_WORKERS: 5
      CELERY_MIN_WORKERS: 2
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/api/storage
      LOG_LEVEL: INFO
    volumes:
      - ./volumes/app/storage:/app/api/storage

  web:
    image: docker.m.daocloud.io/langgenius/dify-web:latest
    restart: always
    depends_on:
      - api
    environment:
      CONSOLE_API_URL: http://localhost:8080/console/api
      APP_API_URL: http://localhost:8080/api
      APP_WEB_URL: http://localhost:8080
      MARKETPLACE_API_URL: https://marketplace.dify.ai
      MARKETPLACE_URL: https://marketplace.dify.ai
      PRIVACY_POLICY_URL: ''
      TERMS_OF_SERVICE_URL: ''
      THEME_BRAND_NAME: Dify
      THEME_FAVICON: ''
      THEME_LOGO: ''
      THEME_LOGO_DARK: ''
      THEME_COLOR: ''
      TEXT_GENERATION_TIMEOUT_MS: 60000
      CSP_WHITELIST: ''
      SENTRY_DSN: ''
      SENTRY_TRACES_SAMPLE_RATE: 1.0
      SENTRY_PROFILES_SAMPLE_RATE: 1.0
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3002:3000"

  # Nginx 反向代理
  nginx:
    image: docker.m.daocloud.io/library/nginx:latest
    restart: always
    depends_on:
      - api
      - web
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./volumes/nginx/conf.d:/etc/nginx/conf.d
      - ./volumes/app/storage:/app/api/storage

networks:
  default:
    name: dify-network
